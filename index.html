<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse the National Pokédex, compare Pokémon and build your own team.">
    <meta name="theme-color" content="#161e2e">
    <link rel="icon" href="/img/icons8-pokeball-48.png">
    <title>PokeDox</title>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top"><div class="shell top-inner">
      <a class="brand" href="/" data-route><span class="ball" aria-hidden="true"></span>Poke<span>Dox</span></a>
      <nav aria-label="Primary">
        <a href="/" data-route>Explore</a><a href="/favorites" data-route>Favorites</a>
        <a href="/compare" data-route>Compare</a><a href="/team" data-route>Team</a>
      </nav>
      <form id="header-search" role="search">
        <input type="search" name="q" aria-label="Search Pokédex" placeholder="Quick search" maxlength="80">
      </form>
      <button id="theme" class="theme" type="button" aria-label="Toggle color theme"></button>
    </div></header>
    <main id="main" class="shell" tabindex="-1"></main>
    <footer class="shell footer"><strong>PokeDox</strong><a href="https://pokeapi.co/">Pokémon data from PokéAPI</a></footer>
    <div id="announcement" class="sr-only" role="status"></div>
    <script type="module" src="/src/scripts.js"></script>
  </body>
</html>
